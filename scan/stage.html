<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tract — stage</title>
    <script>
      (function () {
        var q = new URLSearchParams(location.search).get("theme");
        var saved = null;
        try { saved = localStorage.getItem("tract.theme"); } catch (e) {}
        var theme = q || saved || "dark";
        if (theme === "dark") document.documentElement.dataset.theme = "dark";
        if (q) { try { localStorage.setItem("tract.theme", q); } catch (e) {} }
      })();
    </script>
    <style>
      /* The audience's page. No text, no chrome, nothing to read — the tracts
         fill the projector and that is all. */
      :root {
        color-scheme: light;
        --sans: Arial, "Helvetica Neue", Helvetica, sans-serif;
        --mono: "Andale Mono", Consolas, "Courier New", monospace;
        --bg: #ffeef5;         /* Pink Trombone's own pale pink */
        --tract: #ffc0cb;      /* "pink" */
        --edge: #c070c6;       /* the line upstream draws the tract with */
        --bead: #4a1352;       /* loudness — dark, so it reads on the pink */
        --sub: #6b2b63;        /* the subtitles */
        --dim: #b98aa8;
        --ipa: #4a1352;        /* the phoneme in the crook — the bead's dark */
        /* IPA needs a face that actually has the glyphs. These ship with
           macOS and Windows; the generic serif fallback draws a box for the
           rarer symbols, which is a legible failure rather than a silent one. */
        --ipa-font: "Gentium Plus", "Charis SIL", "Doulos SIL", "Lucida Grande", "Segoe UI", serif;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #101014;
        --tract: #ff7ab6;
        --edge: #ffd0e6;
        --bead: #7ef7d8;       /* against a pink tract, not another pink */
        --sub: #efe6f2;
        --dim: #6b6478;
        --ipa: #ffe9f4;
        --ipa-font: "Gentium Plus", "Charis SIL", "Doulos SIL", "Lucida Grande", "Segoe UI", serif;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font: 14px/1.4 var(--sans);
      }
      body.hushed { cursor: none; }

      /* the grid is laid out in script, to the pixel, so it fills the screen —
         all of it when there are no words, and all but the subtitle strip when
         there are, so a tract is never drawn underneath the text */
      #wall {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: var(--subs, 0px);
      }
      .tile { position: absolute; }
      .tile canvas { width: 100%; height: 100%; display: block; }

      /* ==================================================================
         THE TITLE CARD — what the audience sees before the piece starts.

         The WORDS live in the markup below (search for id="titleCard"), or
         come from a cue: "stage": { "title": { main, sub, by } } in cues.json.
         The LOOK is entirely these four rules, and nothing else on the page
         touches them, so you can rewrite them without breaking the wall:

           .titlecard        the block as a whole — where it sits, how it is
                             aligned, how long it takes to fade
           .titlecard-main   the big line
           .titlecard-sub    the line under it
           .titlecard-by     the byline

         Sizes are in vw so they scale with whatever projector it lands on:
         1vw is one hundredth of the screen's width. Change 9vw to 12vw and
         the title gets bigger on every screen, not just yours.
         ================================================================== */
      .titlecard {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.4vh;
        text-align: center;
        padding: 0 6vw;
        color: var(--sub);
        opacity: 1;
        transition: opacity var(--card-fade, 2s) ease-in-out;
        pointer-events: none;
      }
      .titlecard.gone { opacity: 0; }

      .titlecard-main {
        font-size: 9vw;
        font-weight: 700;
        letter-spacing: 0.06em;
        line-height: 1;
        text-transform: uppercase;
      }
      .titlecard-sub {
        font-size: 2.6vw;
        letter-spacing: 0.14em;
        text-transform: lowercase;
        opacity: 0.85;
      }
      .titlecard-by {
        font-size: 2vw;
        letter-spacing: 0.1em;
        opacity: 0.7;
        margin-top: 1.5vh;
      }

      /* the wall of tracts fades as one, on the same clock as the card */
      #wall {
        opacity: 0;
        transition: opacity var(--wall-fade, 2s) ease-in-out;
      }
      #wall.lit { opacity: 1; }

      /* the only other text on the page, and it goes away by itself */
      #hint {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: var(--dim);
        font: 15px var(--mono);
        letter-spacing: 0.06em;
        line-height: 1.8;
        transition: opacity 400ms linear;
      }
      #hint.gone { opacity: 0; pointer-events: none; }
      #hint b { color: var(--edge); font-weight: 700; }

      /* the words, along the bottom, the way subtitles sit under a film */
      #subtitle {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 2.6vh;
        text-align: center;
        padding: 0 4vw;
        color: var(--sub);
        /* Read from the back of a room, not from a desk. The wall gives up a
           strip for these (--subs, set in stage.js) and that strip is sized to
           match — raising one without the other either crops the words or
           steals height from the drawings for nothing. */
        font-size: clamp(30px, 6vh, 86px);
        line-height: 1.2;
        letter-spacing: 0.01em;
        text-shadow: 0 2px 18px var(--bg);
        transition: opacity 500ms linear;
        pointer-events: none;
      }
      #subtitle.gone { opacity: 0; }

      /* ?debug=1 while setting the room up: who is actually feeding this wall */
      #who {
        position: absolute;
        left: 12px;
        bottom: 10px;
        font: 12px var(--mono);
        color: var(--dim);
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div id="wall"></div>
    <div id="who" hidden></div>
    <div id="subtitle" class="gone"></div>

    <!-- THE TITLE CARD. Edit the three lines here for what shows before the
         first cue; a cue can replace them with "stage": { "title": {...} }.
         The styles are up in the block marked THE TITLE CARD. -->
    <div id="titleCard" class="titlecard">
      <div class="titlecard-main" id="titleMain">Tract</div>
      <div class="titlecard-sub" id="titleSub">for SATB choir</div>
      <div class="titlecard-by" id="titleBy">by Jason Charney</div>
    </div>

    <!-- <div id="hint">
      waiting for the conductor…<br />
      click for full screen
    </div> -->
    <script type="module" src="/scan/src/stage.js?v=2026-10-15b"></script>
  </body>
</html>
